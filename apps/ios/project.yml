# XcodeGen spec: `brew install xcodegen && xcodegen` writes AEEIS.xcodeproj next to this file.
name: AEEIS
options:
  bundleIdPrefix: co.x2v
  deploymentTarget:
    iOS: "17.0"
packages:
  AEEISCore:
    path: .
targets:
  AEEIS:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: AEEISCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AEEIS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/AEEIS.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.x2v.aeeis
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - aeeis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: the login the API uses (aeeis_app). It owns no table, so
  # row-level security applies to it; POSTGRES_USER only runs migrations.
  postgres-roles:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AEEIS_APP_DB_PASSWORD: ${AEEIS_APP_DB_PASSWORD:?Set AEEIS_APP_DB_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v app_password="$$AEEIS_APP_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE aeeis_app LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'aeeis_app')\gexec
        ALTER ROLE aeeis_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD :'app_password';
        SQL

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        AEEIS_GIT_COMMIT: ${AEEIS_GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://aeeis_app:${AEEIS_APP_DB_PASSWORD:?Set AEEIS_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      AEEIS_DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      AEEIS_HOST: 0.0.0.0
      AEEIS_DATA_DIR: /app/data/runs
    volumes:
      - aeeis-data:/app/data
    ports:
      - "127.0.0.1:4323:4323"
    healthcheck:
      # Liveness lets the Worker start; /readyz becomes healthy after the
      # Worker has registered and is checked separately below.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4323/health').then(async r=>{const j=await r.json();process.exit(r.ok&&j.protocol==='aeeis-health/1'&&j.status==='ok'?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        AEEIS_GIT_COMMIT: ${AEEIS_GIT_COMMIT:-unknown}
    command: ["node", "dist/temporal/worker.js"]
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      api:
        condition: service_started
    environment:
      AEEIS_INTERNAL_URL: ${AEEIS_INTERNAL_URL:?Set AEEIS_INTERNAL_URL}
      AEEIS_WORKER_HEALTH_HOST: 0.0.0.0
      AEEIS_WORKER_HEALTH_PORT: 4324
    ports:
      - "127.0.0.1:4324:4324"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4324/readyz').then(async r=>{const j=await r.json();process.exit(r.ok&&j.protocol==='aeeis-worker-readiness/1'&&j.status==='ready'&&j.workerState==='RUNNING'?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  aeeis-postgres:
  aeeis-data:

# Copy to secrets/ssh/<host>.conf (uid 1000, mode 0400) for a plain VPS sandbox host. The API container includes
# /run/aeeis-secrets/ssh/*.conf; the Host name is what local-tools.json puts in hosts.<name>.ssh.
Host aeeis-sandbox-vps
  HostName REPLACE_WITH_TAILNET_NAME_OR_ADDRESS
  User REPLACE_WITH_USER_IN_THE_DOCKER_GROUP
  IdentityFile /run/aeeis-secrets/ssh/aeeis-sandbox-vps.key
  IdentitiesOnly yes
  UserKnownHostsFile /run/aeeis-secrets/ssh/known_hosts
  StrictHostKeyChecking yes

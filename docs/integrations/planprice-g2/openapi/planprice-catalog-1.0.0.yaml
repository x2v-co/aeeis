            X-Request-Id: *a1
            Cache-Control: *a5
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: invalid_query
        "401":
          description: unauthorized
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
            WWW-Authenticate:
              description: Bearer challenge
              schema:
                const: Bearer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: unauthorized
        "403":
          description: forbidden
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: forbidden
        "404":
          description: snapshot_not_found
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: snapshot_not_found
        "405":
          description: method_not_allowed
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
            Allow:
              description: Read-only endpoint
              schema:
                const: GET
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: method_not_allowed
        "406":
          description: not_acceptable
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: not_acceptable
        "429":
          description: rate_limited
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
            Retry-After: *a6
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: rate_limited
        "500":
          description: internal_error
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: internal_error
        "502":
          description: upstream_unavailable
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
            Retry-After: *a6
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: upstream_unavailable
        "503":
          description: catalog_unavailable
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
            Retry-After: *a6
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json
                  - type: object
                    properties:
                      code:
                        const: catalog_unavailable
    post: *rejectReadOnlyMethod
    put: *rejectReadOnlyMethod
    patch: *rejectReadOnlyMethod
    delete: *rejectReadOnlyMethod

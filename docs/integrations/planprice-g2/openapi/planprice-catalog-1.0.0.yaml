components:
  securitySchemes:
    bearerCatalogRead:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: scope catalog:read; historical snapshots also require audience
        permission. Not a management credential.
x-sandbox-profile:
  description: Explicit development/sandbox deployment may remove bearer
    requirements for read endpoints. Production intranet is not exempt. This
    requires an environment-specific spec overlay; no anonymous fallback in
    production.
x-management-origin:
  url: https://manage.planprice.example
  path: /admin/v1/exchange-rates
  status: pending-provider-confirmation
  description: Separate HTTPS host, separate management credential. Management API
    schema is a G3 implementation item; this read spec grants no management
    route.

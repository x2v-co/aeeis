          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/health-1.schema.json
                  - type: object
                    properties:
                      status:
                        const: alive
        "400":
          description: invalid_query
          headers:
            X-Request-Id: *a1
            Cache-Control: *a5
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../schemas/error-1.schema.json

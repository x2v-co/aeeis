<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEEIS · 多 Bot 工作室</title>
  <meta name="description" content="与主页共用对话、任务和 Run 的多 Bot 工作室。">
  <link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/team/styles.css">
</head>
<body>
  <a class="skip-link" href="#stream">跳到消息</a>
  <div class="team-shell">
    <aside class="team-sidebar" aria-label="工作区导航">
      <h1>AEEIS <small>多 Bot 工作室</small></h1>
      <a class="shell-switch" href="/">返回主页 · 当前工作台</a>
      <p id="connection" role="status">未连接，正在检查登录状态…</p>
      <button id="reconnect" type="button">重新连接</button>
      <h2>直接消息</h2><nav id="bots" aria-label="Bot 名册"></nav>
      <h2>频道</h2><nav id="rooms" aria-label="Room 列表"></nav>
      <button id="newChannel" type="button">新建频道</button>
      <label><input id="showArchived" type="checkbox"> 查看归档</label>
      <form id="channelEditor" hidden>
        <h2 id="editorTitle">新建频道</h2>
        <label>名称 <input id="channelTitle" required maxlength="500"></label>
        <label>分类 <select id="channelCategory"><option value="general">通用</option><option value="product">产品</option><option value="topic">主题</option></select></label>
        <label>主题说明 <input id="channelTopic" maxlength="500"></label>
        <label id="channelMemberLabel">成员 id（逗号分隔，可留空）<input id="channelMembers" maxlength="2000"></label>
        <button type="submit">保存频道</button><button id="cancelChannelEdit" type="button">取消</button>
      </form>
    </aside>
    <main class="team-main">
      <header id="channelHead"><h1>选择一位 Bot 或频道</h1></header>
      <div id="channelManagement"></div>
      <div class="team-toolbar">
        <button id="openBoard" type="button" disabled>任务看板</button>
        <button id="openArtifacts" type="button" disabled>产物</button>
        <button id="refresh" type="button" disabled>刷新</button>
      </div>
      <p id="error" role="alert"></p>
      <section id="content" class="team-content">
        <div id="stream" role="log" aria-live="polite">连接后显示服务端记录。</div>
        <form id="composerForm">
          <label for="composerInput">消息</label>
          <textarea id="composerInput" rows="3" maxlength="7000" placeholder="选择对话后发送…" disabled></textarea>
          <div class="team-toolbar">
            <label id="intentLabel">发送方式 <select id="intent"><option value="discuss">讨论</option><option value="execute">执行任务（开 Run）</option></select></label>
            <button id="send" type="submit" disabled>发送</button>
            <button id="retry" type="button" hidden>用同一请求重试</button>
          </div>
          <p id="composerRoute" class="muted">主页与私聊共用同一份记录。执行任务沿用原有审批规则。</p>
        </form>
      </section>
      <section id="board" hidden aria-label="只读任务看板"></section>
      <section id="artifacts" hidden aria-label="产物"></section>
      <section id="taskDetail" hidden aria-label="任务详情"></section>
    </main>
  </div>
  <script src="/team/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEEIS · Project Pulse</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1020; color: #e8edf7; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 0%, #1b315d, transparent 42%), #0b1020; }
      main { max-width: 1180px; margin: 0 auto; padding: 42px 24px 72px; }
      header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 32px; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -.06em; }
      .eyebrow { color: #7dd3fc; text-transform: uppercase; letter-spacing: .18em; font-size: .72rem; font-weight: 700; }
      .muted { color: #9aa8c1; }
      .grid { display: grid; grid-template-columns: 320px 1fr; gap: 18px; }
      .panel { border: 1px solid #263453; background: rgba(16, 25, 49, .86); border-radius: 18px; padding: 20px; box-shadow: 0 20px 70px rgba(0,0,0,.18); }
      form { display: grid; gap: 10px; }
      input, textarea, button { font: inherit; border-radius: 10px; border: 1px solid #33466e; padding: 11px 12px; }
      input, textarea { background: #0c152b; color: #eef4ff; }
      button { cursor: pointer; background: #38bdf8; color: #06111e; font-weight: 750; }
      button.secondary { background: transparent; color: #b8c8e5; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
      .toolbar input { flex: 1; min-width: 180px; }
      .node { position: relative; border: 1px solid #33466e; background: #101b35; border-radius: 14px; padding: 14px; min-width: 190px; }
      .nodes { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .node.ready { border-color: #38bdf8; } .node.running { border-color: #fbbf24; } .node.succeeded { border-color: #4ade80; } .node.failed, .node.unknown { border-color: #fb7185; }
      .status { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: #9aa8c1; }
      .node button { margin-top: 12px; padding: 7px 9px; font-size: .8rem; }
      .receipt { border-left: 2px solid #38bdf8; padding: 7px 12px; margin: 8px 0; color: #c4d0e5; }
      .error { color: #fda4af; min-height: 1.2em; }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } header { display: block; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><div class="eyebrow">AEEIS · MVP</div><h1>Project Pulse</h1><p class="muted">Turn a goal into a visible, resumable plan.</p></div>
        <div class="muted">TypeScript-first · local persistence</div>
      </header>
      <div class="grid">
        <section class="panel">
          <h2>New goal</h2>
          <form id="goal-form"><input id="title" placeholder="Goal title" required /><textarea id="description" placeholder="What should AEEIS help move forward?"></textarea><button>Create goal</button></form>
          <p id="error" class="error"></p>
          <hr />
          <h3>Current goal</h3><p id="goal" class="muted">No goal loaded.</p>
          <form id="memory-form"><input id="memory" placeholder="Add a project memory" required /><button class="secondary">Save memory</button></form>
        </section>
        <section class="panel">
          <div class="toolbar"><input id="goal-id" placeholder="Goal ID" /><button id="load">Load</button><button id="demo" class="secondary">Create demo plan</button></div>
          <h2>Plan graph</h2><div id="nodes" class="nodes"><p class="muted">Create a goal and load a plan.</p></div>
          <h2>Context manifest</h2><button id="context" class="secondary">Build project context</button><pre id="manifest" class="muted"></pre>
          <h2>Run receipts</h2><div id="receipts"><p class="muted">No receipts.</p></div>
        </section>
      </div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>

name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aeeis
          POSTGRES_PASSWORD: aeeis
          POSTGRES_DB: aeeis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeeis -d aeeis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          AEEIS_VERIFY_POSTGRES: '1'
          AEEIS_TEST_DATABASE_URL: postgresql://aeeis:aeeis@127.0.0.1:5432/aeeis
